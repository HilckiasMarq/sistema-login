<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema básico de login</title>
</head>
<body>
    <h1>Login</h1>
    <form action="POST">
        <input id="emailc" type="email" placeholder="Escreva seu e-mail">
        <input id="senhac" type="senha" placeholder="Escreva sua senha">
        <input id="logon" type="button" value="Logar">
    </form>

    <p id="respostal"></p>
    
    <script src="script.js"></script>
</body>
</html>
