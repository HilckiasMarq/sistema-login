<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema básico de login</title>
</head>
<body>
    <h1>Logon</h1>
    <form action="POST">
        <input id="email" type="email" placeholder="Escreva seu e-mail">
        <input id="senha" type="password" placeholder="Escreva sua senha">
        <input id="logon" type="button" value="Logon">
    </form>

    <p id="resposta"></p>
    
    <script src="logon.js"></script>
</body>
</html>
